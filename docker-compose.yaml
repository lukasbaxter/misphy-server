services:
  server:
    container_name: misphy-server
    build: ./server
    ports:
      - "9981:9981"
    env_file:
      - ./server/.env
    volumes:
      - ./server/app:/app/app  
      - ./music:/music

  web:
    container_name: misphy-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "9971:9071"             # cra default
    volumes:
      - ./web:/app              # source code
      - /app/node_modules       # keep node_modules inside the container
    stdin_open: true            # needed for CRA dev server
    tty: true
    depends_on:
      - server
