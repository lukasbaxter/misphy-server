services:
  server:
    container_name: misphy-server
    build: ./server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/app:/app/app  

  web:
    container_name: misphy-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"             # cra default
    volumes:
      - ./web:/app              # source code
      - /app/node_modules       # keep node_modules inside the container
    stdin_open: true            # needed for CRA dev server
    tty: true
    depends_on:
      - server
